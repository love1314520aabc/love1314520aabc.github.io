<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
钟成林 ❤️ 白莲凤 爱情故事
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:
linear-gradient(135deg,#ffd1df,#fff);

font-family:"微软雅黑";

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}



canvas{

position:fixed;

top:0;

left:0;

z-index:0;

}



.card{


width:360px;

background:white;

border-radius:25px;

overflow:hidden;

text-align:center;

box-shadow:
0 15px 40px #ff9bbd;

z-index:2;

}



img{

width:100%;

height:380px;

object-fit:cover;

}



.content{

padding:25px;

}



h1{

color:#ff4081;

font-size:30px;

}


h2{

color:#d63384;

margin:15px;

}



p{

color:#666;

line-height:30px;

}



button{


margin-top:20px;

padding:15px 40px;

border:0;

border-radius:40px;

background:

linear-gradient(
45deg,#ff4081,#ff9ec4
);

color:white;

font-size:18px;


}



.page{

display:none;

}



.page.active{

display:block;

animation:

show .8s;

}



@keyframes show{

from{

opacity:0;

transform:scale(.5);

}


to{

opacity:1;

transform:scale(1);

}

}



video{

width:90%;

border-radius:20px;

}


</style>


</head>


<body>



<canvas id="heart"></canvas>



<div class="card">


<!-- 第一阶段 -->

<div id="page1"
class="page active">


<img src="photos/001.jpg">


<div class="content">


<h1>
💖 CPDD
</h1>


<h2>
寻找另一半
</h2>


<p>

稳重 ❤️

<br>

真诚 ❤️

<br>

浪漫 ❤️

<br>

期待遇见对的人

</p>


<button onclick="next(2)">

💘 CPDD 滴滴我

</button>


</div>


</div>





<!-- 第二阶段 -->


<div id="page2"
class="page">


<img src="photos/002.jpg">


<div class="content">


<h1>
🤝 牵手成功
</h1>


<h2>
钟成林 ❤️ 白莲凤
</h2>


<p>

从陌生人

<br>

到最重要的人

<br>

我们的故事开始啦 ❤️

</p>


<button onclick="next(3)">

💍 走向婚礼

</button>


</div>


</div>






<!-- 第三阶段 -->


<div id="page3"
class="page">


<img src="photos/003.jpg">


<div class="content">


<h1>

💍 我们结婚啦

</h1>


<h2>

执子之手 与子偕老

</h2>



<p>

相遇：

2026.9.8


<br>


婚礼：

2026.9.8

</p>



<video controls>


<source src="video/wedding.mp4">


</video>



<br>



<audio controls autoplay loop>


<source src="music/love.mp3">


</audio>



</div>


</div>



</div>





<script>


//页面切换


function next(num){


document.querySelectorAll(".page")
.forEach(e=>{

e.classList.remove("active");

});


document
.getElementById("page"+num)
.classList.add("active");

}





//爱心雨


let c=document.getElementById("heart");

let ctx=c.getContext("2d");


function resize(){

c.width=innerWidth;

c.height=innerHeight;

}


resize();

window.onresize=resize;



let hearts=[];



for(let i=0;i<100;i++){


hearts.push({

x:Math.random()*c.width,

y:Math.random()*c.height,

s:Math.random()*20+10,

v:Math.random()*2+1

});


}




function animate(){


ctx.clearRect(
0,
0,
c.width,
c.height
);



hearts.forEach(h=>{


ctx.font=h.s+"px Arial";

ctx.fillStyle="#ff8fb8";


ctx.fillText(
"❤",
h.x,
h.y
);


h.y+=h.v;


if(h.y>c.height)

h.y=-20;


});


requestAnimationFrame(animate);


}


animate();



</script>



</body>

</html>
