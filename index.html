<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光影 · 四时集</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

        body {
            min-height: 100vh;
            background: #0d0c0a;
            /* 深邃基底 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 氛围光晕 ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(180, 130, 80, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(200, 160, 110, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(120, 100, 70, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 主容器 ===== */
        .gallery-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .gallery-header {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }

        .gallery-header .ornament {
            display: inline-block;
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(210, 180, 140, 0.6), transparent);
            margin-bottom: 1.25rem;
        }

        .gallery-header h1 {
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 300;
            letter-spacing: 0.18em;
            color: #e8e0d6;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 0.5rem;
        }

        .gallery-header h1 span {
            font-weight: 500;
            color: #d4c0a8;
        }

        .gallery-header .sub {
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            letter-spacing: 0.4em;
            color: rgba(200, 185, 165, 0.5);
            font-weight: 300;
            text-transform: uppercase;
            margin-top: 0.3rem;
        }

        /* ===== 照片网格 ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.8rem;
            perspective: 1200px;
        }

        /* ===== 每张卡片 ===== */
        .photo-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: #1a1714;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 215, 175, 0.06) inset;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform: rotateX(0deg) rotateY(0deg) scale(1);
            cursor: default;
            aspect-ratio: 4 / 5;
            /* 让卡片更接近经典照片比例 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 悬停效果 - 优雅浮起 */
        .photo-card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 215, 175, 0.15) inset;
            z-index: 10;
        }

        /* 图片本身 */
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1),
                filter 0.6s ease;
            filter: brightness(0.92) saturate(1.05) contrast(1.02);
        }

        .photo-card:hover img {
            transform: scale(1.03);
            filter: brightness(1.0) saturate(1.1) contrast(1.05);
        }

        /* ===== 卡片上的编号 / 氛围标记 ===== */
        .photo-card .card-label {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(230, 215, 195, 0.5);
            background: rgba(10, 8, 6, 0.4);
            backdrop-filter: blur(6px);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 175, 0.08);
            font-weight: 300;
            text-transform: uppercase;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .photo-card:hover .card-label {
            color: rgba(230, 215, 195, 0.8);
            background: rgba(10, 8, 6, 0.6);
            border-color: rgba(255, 215, 175, 0.2);
            transform: translateY(-2px);
        }

        /* ===== 微妙光晕 (每张卡片独立氛围) ===== */
        .photo-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 220, 170, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(200, 160, 120, 0.05) 0%, transparent 50%);
            pointer-events: none;
            transition: opacity 0.6s ease;
            opacity: 0.6;
        }

        .photo-card:hover::after {
            opacity: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .photo-grid {
                gap: 1.2rem;
            }

            .photo-card .card-label {
                bottom: 1rem;
                left: 1rem;
                font-size: 0.6rem;
                padding: 0.3rem 0.8rem;
            }
        }

        @media (max-width: 540px) {
            .photo-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }

            .photo-card {
                aspect-ratio: 4 / 5;
                border-radius: 12px;
            }

            .gallery-header {
                margin-bottom: 2.5rem;
            }

            .gallery-header h1 {
                letter-spacing: 0.1em;
            }
        }

        @media (max-width: 400px) {
            .photo-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }

            .photo-card {
                aspect-ratio: 4 / 5;
                max-width: 380px;
                margin: 0 auto;
            }

            body {
                padding: 1rem;
            }
        }

        /* ===== 加载淡入动画 ===== */
        .photo-card {
            opacity: 0;
            animation: cardFadeIn 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .photo-card:nth-child(1) {
            animation-delay: 0.10s;
        }
        .photo-card:nth-child(2) {
            animation-delay: 0.25s;
        }
        .photo-card:nth-child(3) {
            animation-delay: 0.40s;
        }
        .photo-card:nth-child(4) {
            animation-delay: 0.55s;
        }

        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 底部极简签名 ===== */
        .gallery-footer {
            text-align: center;
            margin-top: 3.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: rgba(180, 165, 145, 0.2);
            font-weight: 300;
            border-top: 1px solid rgba(255, 215, 175, 0.04);
            padding-top: 2rem;
        }

        @media (max-width: 540px) {
            .gallery-footer {
                margin-top: 2rem;
                padding-top: 1.5rem;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-wrapper">

        <!-- ====== 头部 ====== -->
        <header class="gallery-header">
            <div class="ornament"></div>
            <h1>四时 · <span>光影</span></h1>
            <p class="sub">片刻 · 静谧 · 叙事</p>
        </header>

        <!-- ====== 照片网格 ====== -->
        <div class="photo-grid">

            <!-- 照片 1 -->
            <figure class="photo-card">
                <img src="photos/001.jpg" alt="光影瞬间 01" loading="lazy" />
                <span class="card-label">01 · 晨</span>
            </figure>

            <!-- 照片 2 -->
            <figure class="photo-card">
                <img src="photos/002.jpg" alt="光影瞬间 02" loading="lazy" />
                <span class="card-label">02 · 昼</span>
            </figure>

            <!-- 照片 3 -->
            <figure class="photo-card">
                <img src="photos/003.jpg" alt="光影瞬间 03" loading="lazy" />
                <span class="card-label">03 · 暮</span>
            </figure>

            <!-- 照片 4 -->
            <figure class="photo-card">
                <img src="photos/004.jpg" alt="光影瞬间 04" loading="lazy" />
                <span class="card-label">04 · 夜</span>
            </figure>

        </div>

        <!-- ====== 底部 ====== -->
        <div class="gallery-footer">
            ✦ 四时集 · 光影之间 ✦
        </div>

    </div>
</body>
</html>
