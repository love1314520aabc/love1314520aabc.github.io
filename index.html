<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPDD 浪漫牵手</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            margin: 0;
            overflow: hidden; /* 隐藏滚动条 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fdfcfb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* 全屏爱心粒子背景 */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            width: 340px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 148, 0.3);
            overflow: hidden;
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-bottom: 2px solid #ffe6f0;
        }

        .info {
            padding: 20px;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tag {
            background: #ffe6f0;
            color: #d63384;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.7);
        }

        /* 牵手成功区域 */
        #success {
            display: none;
        }

        #success img {
            height: 280px;
        }

        .success-title {
            font-size: 32px;
            color: #d63384;
            font-weight: 900;
            margin: 20px 0 10px;
            text-shadow: 2px 2px 0px #fff;
            animation: bounceIn 0.8s;
        }

        .success-sub {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        /* 按钮置灰 */
        .btn-disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 小动画 */
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 浪漫爱心粒子背景层 -->
    <canvas id="heartCanvas"></canvas>

    <div class="card">
        <!-- 初始状态 -->
        <div id="initial">
            <img src="001.jpg" alt="求偶主角"> 
            <div class="info">
                <div class="name">寻找另一半</div>
                <div class="tags">
                    <span class="tag">稳重</span>
                    <span class="tag">清爽穿搭</span>
                    <span class="tag">浪漫深情</span>
                    <span class="tag">真诚靠谱</span>
                </div>
                <p style="color:#666; margin-bottom: 20px;">期待遇到三观契合的你，一起步入婚姻殿堂。</p>
                <a href="javascript:void(0)" class="btn" onclick="showSuccess()">💖 CPDD 滴滴我 💖</a>
            </div>
        </div>

        <!-- 结婚场景展示区 -->
        <div id="success">
            <img src="002.jpg" alt="牵手成功">
            <div class="success-title">💍 求婚成功！💍</div>
            <div class="success-sub">执子之手，与子偕老。我们结婚啦！❤️</div>
            <button class="btn btn-disabled" disabled>已牵手成功，幸福美满</button>
        </div>
    </div>

    <script>
        // 1. 点击切换逻辑
        function showSuccess() {
            var initial = document.getElementById("initial");
            var success = document.getElementById("success");
            initial.style.display = "none";
            success.style.display = "block";
            
            // 点击后让爱心下得更猛烈一点！
            increaseHeartRate();
        }

        // 2. 背景爱心粒子特效 (Canvas)
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let hearts = [];
        let heartRate = 1; // 默认密度

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 爱心类
        class Heart {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height; // 从顶部开始
                this.size = Math.random() * 15 + 5;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.color = Math.random() > 0.5 ? '#ff4d6d' : '#ffb3c6';
            }
            
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                // 到底部后重置到顶部
                if (this.y > height + 20) {
                    this.y = -20;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('❤', 0, 0);
                ctx.restore();
            }
        }

        // 初始化爱心
        function initHearts() {
            hearts = [];
            for (let i = 0; i < 50 * heartRate; i++) {
                hearts.push(new Heart());
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });
            requestAnimationFrame(animate);
        }

        // 增加浪漫度（点击后触发）
        function increaseHeartRate() {
            heartRate = 4; // 增加密度
            initHearts();
        }

        initHearts();
        animate();
    </script>
</body>
</html>
