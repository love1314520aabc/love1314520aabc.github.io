<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>钟成林 ❤️ 白莲凤 婚礼邀请</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;

    overflow:hidden;

    font-family:"Microsoft YaHei";

    background:
    linear-gradient(
    135deg,
    #ffd6e7,
    #fff5f8
    );

}




canvas{

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    z-index:0;

}




.page{

    display:none;

    position:absolute;

    width:100%;

    height:100%;

    justify-content:center;

    align-items:center;

    text-align:center;

    z-index:5;

}


.page.active{

    display:flex;

}





.card{


    width:360px;

    background:white;

    border-radius:25px;

    padding:25px;

    box-shadow:

    0 10px 40px

    rgba(255,80,130,.3);


}




.photo{


    width:100%;

    height:330px;

    object-fit:cover;

    border-radius:20px;

}





h1{


    margin:20px 0;

    color:#e91e63;

    font-size:30px;


}




.text{


    color:#666;

    line-height:30px;

    font-size:17px;


}




button{


    margin-top:25px;

    padding:15px 40px;

    border:none;

    border-radius:40px;

    background:

    linear-gradient(
    45deg,
    #ff4d88,
    #ff9ab8
    );


    color:white;

    font-size:18px;

    cursor:pointer;


}





.names{


font-size:28px;

color:#e91e63;

font-weight:bold;


}




.heart{


font-size:45px;

animation:pulse 1s infinite;


}



@keyframes pulse{


50%{

transform:scale(1.3);

}


}




.final{


font-size:32px;

color:#e91e63;

font-weight:bold;

margin-top:20px;


}


</style>

</head>



<body>



<!-- 音乐 -->

<audio id="loveMusic">

<source src="music/zanmenjiehunba.mp3" type="audio/mp3">

</audio>



<canvas id="heart"></canvas>





<!-- 第1页 CPDD -->

<div class="page active" id="page1">


<div class="card">


<img class="photo" src="photos/001.jpg">


<div class="names">

钟成林 ❤️ 白莲凤

</div>


<h1>

💖 CPDD

</h1>


<div class="text">

期待遇见最好的你<br>

一起走向幸福婚姻殿堂

<br><br>

2026.9.8

</div>



<button onclick="startLove()">

💘 CPDD 滴滴我

</button>



</div>


</div>





<!-- 第2页 牵手成功 -->


<div class="page" id="page2">


<div class="card">


<img class="photo" src="photos/002.jpg">


<div class="heart">

❤️

</div>



<h1>

牵手成功

</h1>


<div class="text">

从认识到相爱

<br>

从心动到陪伴

<br>

我们终于遇见彼此

</div>



<button onclick="goWedding()">

💍 进入婚礼现场

</button>



</div>


</div>
<!-- 第3页 婚礼现场 -->

<div class="page" id="page3">

<div class="card">


<img class="photo" src="photos/002.jpg">


<div class="heart">

💍

</div>


<h1>

我们结婚啦！

</h1>



<div class="final">

钟成林 ❤️ 白莲凤

</div>


<div class="text">

执子之手<br>

与子偕老

<br><br>

2026年9月8日

<br><br>

愿余生都是你 ❤️

</div>


</div>

</div>





<script>


// ======================
// 页面切换
// ======================


function showPage(num){


document
.querySelectorAll(".page")
.forEach(function(p){

p.classList.remove("active");

});



document
.getElementById("page"+num)
.classList.add("active");


}






// ======================
// 点击CPDD
// ======================


function startLove(){



let music =
document.getElementById("loveMusic");



music.volume=0.6;



music.play();



showPage(2);



for(let i=0;i<30;i++){

createPetal();

}



}






// ======================
// 进入婚礼
// ======================


function goWedding(){


showPage(3);



firework();



setTimeout(function(){

firework();

},800);



setTimeout(function(){

firework();

},1600);



}







// ======================
// 爱心背景
// ======================


let canvas =
document.getElementById("heart");


let ctx =
canvas.getContext("2d");



function resize(){


canvas.width =
window.innerWidth;


canvas.height =
window.innerHeight;


}



resize();


window.onresize=resize;



let hearts=[];



class Heart{


constructor(){


this.x=Math.random()*canvas.width;

this.y=Math.random()*canvas.height;


this.size=Math.random()*20+10;


this.speed=Math.random()*2+1;


}


update(){


this.y+=this.speed;



if(this.y>canvas.height){


this.y=-20;


this.x=Math.random()*canvas.width;


}


}




draw(){


ctx.font=this.size+"px Arial";


ctx.fillStyle="#ff7aa8";


ctx.fillText(

"❤",

this.x,

this.y

);


}



}




for(let i=0;i<80;i++){


hearts.push(new Heart());


}



function animate(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



hearts.forEach(function(h){


h.update();


h.draw();


});



requestAnimationFrame(animate);


}



animate();







// ======================
// 花瓣
// ======================


function createPetal(){



let p=document.createElement("div");



p.innerHTML="🌸";



p.style.position="fixed";

p.style.left=
Math.random()*100+"%";


p.style.top="-30px";


p.style.fontSize="25px";


p.style.zIndex="20";



p.style.animation=
"fall 5s linear";



document.body.appendChild(p);



setTimeout(function(){


p.remove();


},5000);



}




let style=document.createElement("style");


style.innerHTML=`

@keyframes fall{


0%{

transform:
translateY(0)
rotate(0deg);

}


100%{

transform:
translateY(110vh)
rotate(360deg);

}


}

`;


document.head.appendChild(style);







// ======================
// 烟花
// ======================


function firework(){



for(let i=0;i<50;i++){


let s=document.createElement("div");



s.innerHTML="✨";



s.style.position="fixed";

s.style.left="50%";

s.style.top="50%";

s.style.fontSize="30px";

s.style.zIndex="30";



let x=
(Math.random()-0.5)*600;


let y=
(Math.random()-0.5)*600;



s.animate([


{

transform:"translate(0,0)",

opacity:1

},


{

transform:
`translate(${x}px,${y}px)`,

opacity:0

}


],

{

duration:1500

});



document.body.appendChild(s);



setTimeout(function(){


s.remove();


},1500);



}


}



</script>


</body>

</html>
