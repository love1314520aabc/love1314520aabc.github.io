<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>吃瓜中转站</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0c0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            color: #e8e0d6;
        }

        .app {
            width: 100%;
            max-width: 1000px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header .ornament {
            display: inline-block;
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(210, 180, 140, 0.6), transparent);
            margin-bottom: 1rem;
        }
        .header h1 {
            font-weight: 300;
            font-size: 2.4rem;
            letter-spacing: 0.12em;
        }
        .header h1 span {
            font-weight: 500;
            color: #d4c0a8;
        }
        .header .sub {
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: rgba(200, 185, 165, 0.4);
            text-transform: uppercase;
            margin-top: 0.3rem;
        }

        /* ===== 网格（一行两张） ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }

        .grid-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4 / 5;
            background: #1a1714;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }
        .grid-item:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s;
        }
        .grid-item .label {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(230, 215, 195, 0.6);
            background: rgba(10, 8, 6, 0.5);
            backdrop-filter: blur(4px);
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 175, 0.08);
            pointer-events: none;
        }
        .grid-item .fallback {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2a2520;
            color: rgba(200, 185, 165, 0.3);
            font-size: 0.8rem;
        }
        .grid-item .fallback .icon {
            font-size: 2rem;
            opacity: 0.4;
        }

        /* ===== 全屏查看器 ===== */
        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(8, 6, 5, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .viewer.active {
            display: flex;
            opacity: 1;
        }

        .viewer .close-btn {
            position: absolute;
            top: 1.8rem;
            right: 1.8rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #d4c0a8;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            backdrop-filter: blur(4px);
        }
        .viewer .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.08);
        }

        .viewer .slider {
            position: relative;
            width: 100%;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pan-y;
        }

        /* ---- 修改重点：图片容器和图片样式 ---- */
        .viewer .slider .image-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #14110e;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .viewer .slider .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            /* 保证完整显示，无裁剪 */;
        }

        .viewer .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4c0a8;
            font-size: 1.6rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            opacity: 0.6;
        }
        .viewer .arrow:hover {
            background: rgba(0, 0, 0, 0.6);
            opacity: 1;
        }
        .viewer .arrow-left {
            left: 1rem;
        }
        .viewer .arrow-right {
            right: 1rem;
        }

        .viewer .counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(200, 185, 165, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 175, 0.06);
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 540px) {
            .grid {
                gap: 0.8rem;
            }
            .grid-item {
                border-radius: 12px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .viewer .arrow {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .viewer .arrow-left {
                left: 0.3rem;
            }
            .viewer .arrow-right {
                right: 0.3rem;
            }
            .viewer .close-btn {
                top: 1rem;
                right: 1rem;
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            body {
                padding: 0.8rem;
            }
        }

        .grid-item {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        .grid-item:nth-child(1) { animation-delay: 0.05s; }
        .grid-item:nth-child(2) { animation-delay: 0.12s; }
        .grid-item:nth-child(3) { animation-delay: 0.19s; }
        .grid-item:nth-child(4) { animation-delay: 0.26s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scroll {
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="ornament"></div>
            <h1> <span>吃瓜前线</span></h1>
            <p class="sub">片刻 · 静谧 · 叙事</p>
        </header>

        <div class="grid" id="photoGrid"></div>
    </div>

    <!-- ===== 查看器 ===== -->
    <div class="viewer" id="viewer">
        <button class="close-btn" id="closeViewer" aria-label="关闭">✕</button>
        <div class="slider" id="slider">
            <button class="arrow arrow-left" id="prevBtn" aria-label="上一张">‹</button>
            <div class="image-wrapper" id="imageWrapper">
                <img id="viewerImage" src="" alt="查看图片" />
            </div>
            <button class="arrow arrow-right" id="nextBtn" aria-label="下一张">›</button>
        </div>
        <div class="counter" id="counter">1 / 4</div>
    </div>

    <script>
        (function() {
            const photos = [
                { src: './photos/001.jpg', },
                { src: './photos/002.jpg', },
                { src: './photos/003.jpg', },
                { src: './photos/004.jpg', }
            ];

            const grid = document.getElementById('photoGrid');
            const viewer = document.getElementById('viewer');
            const viewerImage = document.getElementById('viewerImage');
            const counter = document.getElementById('counter');
            const closeBtn = document.getElementById('closeViewer');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            let currentIndex = 0;
            let touchStartX = 0;
            let touchEndX = 0;
            let isSwiping = false;

            function renderGrid() {
                grid.innerHTML = '';
                photos.forEach((photo, index) => {
                    const item = document.createElement('div');
                    item.className = 'grid-item';
                    item.dataset.index = index;

                    const img = document.createElement('img');
                    img.src = photo.src;
                    img.alt = photo.label;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = this.nextElementSibling;
                        if (fallback && fallback.classList.contains('fallback')) {
                            fallback.style.display = 'flex';
                        }
                    };

                    const fallback = document.createElement('div');
                    fallback.className = 'fallback';
                    fallback.innerHTML = `
                        <span class="icon">🖼️</span>
                        <span>无法加载</span>
                        <span style="font-size:0.6rem;opacity:0.5;margin-top:0.3rem;">${photo.src}</span>
                    `;

                    const label = document.createElement('span');
                    label.className = 'label';
                    label.textContent = photo.label;

                    item.appendChild(img);
                    item.appendChild(fallback);
                    item.appendChild(label);

                    item.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        openViewer(idx);
                    });

                    grid.appendChild(item);
                });
            }

            function openViewer(index) {
                if (index < 0) index = 0;
                if (index >= photos.length) index = photos.length - 1;
                currentIndex = index;
                updateViewerImage();
                viewer.classList.add('active');
                document.body.classList.add('no-scroll');
                touchStartX = 0;
                touchEndX = 0;
                isSwiping = false;
            }

            function closeViewer() {
                viewer.classList.remove('active');
                document.body.classList.remove('no-scroll');
            }

            function updateViewerImage() {
                const photo = photos[currentIndex];
                viewerImage.src = photo.src;
                viewerImage.alt = photo.label;
                viewerImage.onerror = function() {
                    this.alt = '图片加载失败';
                };
                counter.textContent = `${currentIndex + 1} / ${photos.length}`;
            }

            function goToPrev() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateViewerImage();
                }
            }

            function goToNext() {
                if (currentIndex < photos.length - 1) {
                    currentIndex++;
                    updateViewerImage();
                }
            }

            // 事件绑定
            closeBtn.addEventListener('click', closeViewer);
            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);

            document.addEventListener('keydown', function(e) {
                if (!viewer.classList.contains('active')) return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToPrev();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToNext();
                } else if (e.key === 'Escape') {
                    closeViewer();
                }
            });

            const slider = document.getElementById('slider');
            slider.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchEndX = touch.clientX;
                isSwiping = true;
            }, { passive: true });

            slider.addEventListener('touchmove', function(e) {
                if (!isSwiping) return;
                const touch = e.touches[0];
                touchEndX = touch.clientX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 10) {
                    e.preventDefault();
                }
            }, { passive: false });

            slider.addEventListener('touchend', function(e) {
                if (!isSwiping) return;
                isSwiping = false;
                const diff = touchEndX - touchStartX;
                const threshold = 40;
                if (Math.abs(diff) > threshold) {
                    if (diff < 0) {
                        goToNext();
                    } else {
                        goToPrev();
                    }
                }
                touchStartX = 0;
                touchEndX = 0;
            }, { passive: true });

            // 初始化
            renderGrid();
        })();
    </script>
</body>
</html>
